name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SITE_PATH }}
            # pull BEFORE running the script — a script must never replace ITSELF
            # mid-run (the shell keeps executing the old bytes, so deploy.sh
            # changes would otherwise lag one deploy behind)
            git pull
            sh deploy.sh
