<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Stickies">
  <!-- note body: default sticky cream, full-bleed, hard corners -->
  <rect width="32" height="32" fill="#f4ecc9"/>
  <!-- glue bar across the top (darker shade of the same yellow) -->
  <rect width="32" height="7" fill="#dcc56f"/>
  <!-- writing lines -->
  <g fill="#3c3222" opacity="0.42">
    <rect x="6" y="14" width="20" height="2"/>
    <rect x="6" y="19" width="20" height="2"/>
    <rect x="6" y="24" width="13" height="2"/>
  </g>
</svg>
